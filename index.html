<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forg Search</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f5f6f8;
      color: #222;
    }
    h1 { margin: 0; font-weight: 600; letter-spacing: -0.5px; }
    form {
      display: flex;
      width: min(560px, 90vw);
      background: #fff;
      border: 1px solid #d5d8de;
      border-radius: 999px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    input[type="text"] {
      flex: 1;
      border: none;
      outline: none;
      padding: 14px 20px;
      font-size: 16px;
      background: transparent;
    }
    button {
      border: none;
      padding: 0 24px;
      font-size: 16px;
      background: #de5833;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #c44a28; }
  </style>
</head>
<body>
  <h1>Forg Search</h1>
  <form id="search-form">
    <input type="text" id="query" placeholder="Search DuckDuckGo..." autocomplete="off" autofocus required>
    <button type="submit">Search</button>
  </form>

  <script>
    document.getElementById('search-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var q = document.getElementById('query').value.trim();
      if (q) {
        window.location.href = 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
      }
    });
  </script>
</body>
</html>
